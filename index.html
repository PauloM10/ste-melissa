<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Oficial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #faf4f6; color: #333; padding-bottom: 40px; }
    
    header {
      background: linear-gradient(135deg, #d63384, #f783ac);
      color: white;
      text-align: center;
      padding: 25px 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .logo-container {
      margin-bottom: 10px;
    }

    .logo-img {
      max-width: 130px;
      max-height: 130px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      object-fit: cover;
      background: white;
    }

    header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: 1px; }
    header p { font-size: 0.9rem; opacity: 0.95; margin-top: 4px; }

    /* BANNER DE FORMAS DE PAGAMENTO NO TOPO */
    .pagamento-banner {
      max-width: 1000px;
      margin: 0 auto 20px auto;
      padding: 0 15px;
      text-align: center;
    }

    .pagamento-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(214, 51, 132, 0.08);
      border: 1px solid #f7e6eb;
      display: inline-block;
      width: 100%;
    }

    .pagamento-card h4 {
      color: #d63384;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .pagamento-img {
      max-width: 100%;
      max-height: 90px;
      object-fit: contain;
    }

    /* FILTROS DE CATEGORIA */
    .filtros {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 0 auto 25px auto;
      padding: 0 15px;
    }

    .btn-filtro {
      background: white;
      border: 1px solid #f3d0db;
      color: #d63384;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-filtro.ativo, .btn-filtro:hover {
      background: #d63384;
      color: white;
      border-color: #d63384;
    }

    /* GRID DE PRODUTOS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 12px rgba(214, 51, 132, 0.08);
      display: flex;
      flex-direction: column;
      border: 1px solid #f7e6eb;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 18px rgba(214, 51, 132, 0.15);
    }

    .img-container {
      width: 100%;
      height: 200px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background-color: #fcf8f9;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card img:hover { transform: scale(1.05); }

    .tag-zoom {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 10px;
      pointer-events: none;
    }

    .card h3 { font-size: 1.05rem; margin: 12px 0 6px; color: #2c2c2c; }
    .card p { font-size: 0.85rem; color: #666; flex-grow: 1; margin-bottom: 12px; line-height: 1.3; }
    .card .preco { font-size: 1.2rem; font-weight: bold; color: #d63384; margin-bottom: 12px; }

    .btn-wa {
      background: #25D366;
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-wa:hover { background: #1ebc57; }

    /* MODAL DE ZOOM DA FOTO */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    .fechar-modal {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <!-- LOGO DA LOJA (Aparecerá se a URL for informada no JS) -->
    <div id="logoContainer" class="logo-container" style="display: none;">
      <img id="logoImg" src="" alt="Logo da Loja" class="logo-img">
    </div>
    <h1>Catálogo Oficial</h1>
    <p>Escolha seus produtos e peça direto no WhatsApp</p>
  </header>

  <!-- BANNER DE FORMAS DE PAGAMENTO -->
  <div id="pagamentoSection" class="pagamento-banner" style="display: none;">
    <div class="pagamento-card">
      <h4>💳 Formas de Pagamento Aceitas</h4>
      <img id="pagamentoImg" src="" alt="Formas de Pagamento" class="pagamento-img">
    </div>
  </div>

  <!-- BOTÕES DE FILTRO -->
  <div class="filtros">
    <button class="btn-filtro ativo" onclick="filtrar('Todos')">Todos</button>
    <button class="btn-filtro" onclick="filtrar('Maquiagem')">Maquiagem</button>
    <button class="btn-filtro" onclick="filtrar('Skincare')">Skincare</button>
    <button class="btn-filtro" onclick="filtrar('Pincéis')">Pincéis & Acessórios</button>
  </div>

  <!-- LISTA DE PRODUTOS -->
  <div id="catalogo" class="grid">Carregando produtos...</div>

  <!-- MODAL DE ZOOM -->
  <div id="modalZoom" class="modal" onclick="fecharZoom()">
    <span class="fechar-modal">&times;</span>
    <img id="imgExpandida" class="modal-content">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // =========================================================================
    // 1. COLE AQUI OS LINKS DAS IMAGENS DA LOGO E DO PAGAMENTO DO CLOUDINARY
    // =========================================================================
    const URL_LOGO = "https://res.cloudinary.com/ddfqhj1b7/image/upload/v1788024805/logo_lfk3l4.jpg";      
    const URL_PAGAMENTO = "https://res.cloudinary.com/ddfqhj1b7/image/upload/v1788024814/pagamento_pj92ww.jpg"; 

    const firebaseConfig = {
      apiKey: "AIzaSyAzGjxA_aydcjGqx-umPSmFOrY-8yGA8rw",
      authDomain: "meu-catalogo-wa.firebaseapp.com",
      projectId: "meu-catalogo-wa",
      storageBucket: "meu-catalogo-wa.firebasestorage.app",
      messagingSenderId: "634155499123",
      appId: "1:634155499123:web:1c7eb77a88840e40033406"
    };

    const SEU_WHATSAPP = "5581991421159";

    // Exibe a Logo caso o link esteja preenchido
    if (URL_LOGO) {
      document.getElementById('logoImg').src = URL_LOGO;
      document.getElementById('logoContainer').style.display = 'block';
    }

    // Exibe o Banner de Pagamento caso o link esteja preenchido
    if (URL_PAGAMENTO) {
      document.getElementById('pagamentoImg').src = URL_PAGAMENTO;
      document.getElementById('pagamentoSection').style.display = 'block';
    }

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let todosProdutos = [];

    async function carregarProdutos() {
      const container = document.getElementById('catalogo');
      
      try {
        const querySnapshot = await getDocs(collection(db, "produtos"));
        todosProdutos = [];

        querySnapshot.forEach((doc) => {
          todosProdutos.push(doc.data());
        });

        renderizarProdutos(todosProdutos);
      } catch (err) {
        console.error("Erro:", err);
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Erro ao carregar o catálogo.</p>";
      }
    }

    function renderizarProdutos(lista) {
      const container = document.getElementById('catalogo');
      container.innerHTML = "";

      if (lista.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #888;'>Nenhum produto encontrado nesta categoria.</p>";
        return;
      }

      lista.forEach((item) => {
        const precoValor = Number(item.preco) || 0;
        const precoFormatado = precoValor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        
        const textoWa = encodeURIComponent(`Olá! Gostaria de encomendar: *${item.nome}* (${precoFormatado})`);
        const urlWa = `https://wa.me/${SEU_WHATSAPP}?text=${textoWa}`;

        container.innerHTML += `
          <div class="card">
            <div class="img-container" onclick="abrirZoom('${item.imagem}')">
              <img src="${item.imagem}" alt="${item.nome}">
              <span class="tag-zoom">🔍 Clique para ampliar</span>
            </div>
            <h3>${item.nome}</h3>
            <p>${item.descricao || ''}</p>
            <div class="preco">${precoFormatado}</div>
            <a href="${urlWa}" target="_blank" rel="noopener noreferrer" class="btn-wa">
              Pedir no WhatsApp
            </a>
          </div>
        `;
      });
    }

    window.filtrar = (cat) => {
      const botoes = document.querySelectorAll('.btn-filtro');
      botoes.forEach(b => {
        if (b.innerText.includes(cat) || (cat === 'Todos' && b.innerText === 'Todos')) {
          b.classList.add('ativo');
        } else {
          b.classList.remove('ativo');
        }
      });

      if (cat === 'Todos') {
        renderizarProdutos(todosProdutos);
      } else {
        const filtrados = todosProdutos.filter(p => p.categoria === cat);
        renderizarProdutos(filtrados);
      }
    };

    window.abrirZoom = (url) => {
      document.getElementById('imgExpandida').src = url;
      document.getElementById('modalZoom').style.display = 'flex';
    };

    window.fecharZoom = () => {
      document.getElementById('modalZoom').style.display = 'none';
    };

    carregarProdutos();
  </script>
</body>
</html>
